<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        // Nhập lại đến khi n >=0
        do{
            var n  = prompt("Nhập số n:")
            
            //Kiểm tra n>0
            if(n>0){
                console.log("N là số dương")
            }
        }while(n<0)

    </script>
